<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="/"></ion-back-button>
    </ion-buttons>
    <ion-title class="title-header">Doctores</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Doctores</ion-title>
    </ion-toolbar>
  </ion-header>


  <ion-item>
    <ion-button (click)="openModal()" color="dark" expand="block">
      Agregar
    </ion-button>
  </ion-item>
  <ion-list class="Docs-list">
    <ion-card *ngFor="let doctor of doctores">
      <ion-card-content>
        <p> 
          <strong>Dr:</strong> {{ doctor.nombre }} {{ doctor.apellido }}
        </p> 
        <p>
          <strong>Especialidad</strong> 
          <p>
            {{ doctor.especialidad }}
          </p>

      <ion-button (click)="openModal(doctor)" color="dark"><ion-icon name="create-outline"></ion-icon></ion-button>
      <ion-button (click)="confirmDelete(doctor.id)" color="dark"><ion-icon name="trash-outline"></ion-icon></ion-button>
      </ion-card-content>
    </ion-card>
  </ion-list> 

    <!-- Modal para el formulario de doctor -->
    <ion-modal [isOpen]="showForm" (willDismiss)="closeModal()">
      <ion-content>
        <app-doctor-form
          [doctor]="selectedDoctor"
          (onSubmit)="handleFormSubmit($event)">
        </app-doctor-form>
      </ion-content>
    </ion-modal>
</ion-content>
