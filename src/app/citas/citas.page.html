<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button 
      text="" default-href="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Citas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

<ion-content>
  <div class="calendar-container">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>

  <div class="event-header">
    <h2>Próximas Citas</h2>
  </div>

  <ion-list class="event-list">
    <ion-card *ngFor="let event of events" class="event-card">
      <ion-card-content>
        <strong>{{ event.title }}</strong> 
        <p>Estado: {{ event.status }}</p> 
        <p>Fecha:{{ event.date | date }}, {{ event.time }}</p>
        <p>Paciente: {{ event.name }}</p><br>
        <p id="Doctor">Doctor: {{ event.doctor }}</p>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
