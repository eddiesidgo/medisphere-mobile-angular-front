<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="medium" (click)="closeModal()">Cancel</ion-button>
    </ion-buttons>
    <ion-title>Citas</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Formulario de Cita</ion-card-title>
    </ion-card-header>
    <form [formGroup]="citaForm" (ngSubmit)="submitForm()">

      <ion-item>
        <ion-label>Doctor</ion-label>
        <ion-input
          (ionInput)="onBuscarDoctor($event)"
          placeholder="Buscar doctor..."
          clearInput
        ></ion-input>
      </ion-item>
      

      <!-- Lista de resultados de búsqueda filtrados -->
      <ion-list *ngIf="resultadosDoctores.length > 0">
        <ion-item *ngFor="let doctor of resultadosDoctores" (click)="seleccionarDoctor(doctor)">
          {{ doctor.nombre }}
        </ion-item>
      </ion-list>
      
      <ion-item>
        <ion-label>Paciente</ion-label>
        <ion-input
          (ionInput)="onBuscarPaciente($event)"
          placeholder="Buscar paciente..."
          clearInput
        ></ion-input>
      </ion-item>
       <ion-list *ngIf="resultadosDoctores.length > 0">
        <ion-item *ngFor="let doctor of resultadosDoctores" (click)="seleccionarPaciente(doctor)">
          {{ doctor.nombre }}
        </ion-item>
      </ion-list>
      
      <ion-item>
        <ion-label position="floating">Título</ion-label>
        <ion-input formControlName="title"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label >Fecha y Hora</ion-label>
        <!-- Botón que abre el selector de fecha y hora -->
        <ion-datetime-button datetime="datetime"></ion-datetime-button>
        <!-- Aquí se monta el modal con el selector de fecha y hora -->
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime id="datetime" presentation="date-time" (ionChange)="onDateChange($event)"></ion-datetime>
          </ng-template>
        </ion-modal>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Estado</ion-label>
        <ion-input formControlName="estado"></ion-input>
      </ion-item>

      <ion-button expand="full" type="submit">Crear Cita</ion-button>
    </form>

  </ion-card>

</ion-content>
